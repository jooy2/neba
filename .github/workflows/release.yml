name: release

# The npm package and a GitHub release for every version tag: the tag is pushed
# once the "chore: cut X" commit is on `main`, and everything after it is here —
# the checks that the tag names the version that was cut, the package built the
# way `npm publish` builds it, that package published to npm through trusted
# publishing, and the release written from that version's changelog section
# with the same tarball attached.
#
# Run from the Actions tab instead, it writes the releases a tag push could not:
# a tag runs the workflow file of its own commit, and the commits of 1.16.2 and
# every version before it have none. See `scripts/release-backfill.mjs`.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to write a release for, such as v1.16.2 — or "all", for every tag that has none'
        required: true
        default: all

permissions:
  contents: write

# Two pushes of the same tag are the same release; the second waits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: npm and GitHub release
    # The environment npm's trusted publisher for `neba` names. npm accepts a
    # publish only from this workflow file running in it, so the environment's
    # own protection rules, where there are any, stand in front of npm too.
    environment: release
    # `id-token` is what npm exchanges for a publish token that lives as long as
    # the job: there is no npm token stored anywhere for this repository.
    permissions:
      contents: write
      id-token: write
    # A build, two checks and two uploads. Well above what that takes, because a
    # job that hangs here holds a runner for nothing.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        name: Setup Node.js
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      # The tag is typed by hand and the version is in two files; a `v1.17.1`
      # pushed onto the 1.17.0 commit would otherwise publish a release whose
      # tarball says something else.
      - name: Check the tag names the version in package.json
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME} and package.json says ${version}. Tag the commit that cut v${version}."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # First, so a tag on a commit whose changelog still says `vNext` fails in
      # seconds rather than after the build.
      - name: Write the release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" > "$RUNNER_TEMP/notes.md"

      # Without the scripts: `prepare` is the build, and `npm pack` runs it
      # below, so running it here as well would build twice.
      - run: npm ci --ignore-scripts

      # `npm pack` runs `prepare` and packs what `.npmignore` lets through, which
      # is exactly what `npm publish` will upload — the tarball on the release
      # is the package, not a second build of it.
      - name: Build and pack
        run: npm pack --pack-destination "$RUNNER_TEMP"

      # The same two checks `run-test.yml` runs on `main`, on the build that is
      # being attached. The tests are not run again: the tag goes on a commit
      # whose `main` run has already passed them.
      - name: Check the bundle budgets
        run: npm run size
      - name: Check the minimum browser versions
        run: npm run compat

      # Trusted publishing exchanges the job's OIDC token for a publish token,
      # which npm does from 11.5.1, and attaches a provenance statement to the
      # version. The tarball is the one packed above, so npm serves exactly
      # what is attached to the release. Skipped when npm already has the
      # version, so pushing the tag again to repair the release does not fail
      # here; a version with a pre-release part goes out under `next` rather
      # than `latest`.
      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm_version=$(npm --version)
          if ! node -e "const [a, b, c] = process.argv[1].split('.').map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)" "$npm_version"; then
            echo "::error::npm ${npm_version} cannot publish through trusted publishing, which needs 11.5.1 or later."
            exit 1
          fi
          if [ -n "$(npm view "neba@${VERSION}" version 2> /dev/null)" ]; then
            echo "npm already has neba@${VERSION}; not publishing it again."
            exit 0
          fi
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          npm publish "$(ls "$RUNNER_TEMP"/*.tgz)" --access public --tag "$tag"

      # Created, or brought up to date when the tag is pushed again after a
      # release already exists, so a re-run never fails on its own earlier
      # success. A version with a pre-release part is marked as one.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tarball=$(ls "$RUNNER_TEMP"/*.tgz)
          notes="$RUNNER_TEMP/notes.md"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$VERSION" --notes-file "$notes"
            gh release upload "$GITHUB_REF_NAME" "$tarball" --clobber
          else
            prerelease=""
            case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" "$tarball" --verify-tag \
              --title "$VERSION" --notes-file "$notes" $prerelease
          fi

  # The releases for tags pushed before this file existed. The body comes from
  # today's changelog, whose released sections never change, and the tarball
  # is the one npm is serving for that version rather than a rebuild of it.
  # Every release it creates is marked as not the latest.
  backfill:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: GitHub releases for older tags
    # Twenty-odd downloads and uploads of well under a megabyte each.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        name: Setup Node.js
        with:
          node-version: '26'

      # The input goes through the environment rather than into the script, so
      # whatever is typed into the form is an argument and never shell.
      - name: Write the releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: node scripts/release-backfill.mjs "$TAG"
