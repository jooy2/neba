name: run-test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - src/**
      - test/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - tsconfig.prod.json
      - vitest.config.ts
      - .github/workflows/run-test.yml
  workflow_dispatch:

# A superseded pull request run has nothing left to say, and a run that has
# wedged holds a runner until it is noticed. Pushes to `main` are exempt: each
# one is a commit whose own result is worth having.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint and typecheck
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        name: Setup Node.js
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npx prettier . --check
      - name: Typecheck
        run: npm run typecheck

  run-test:
    runs-on: ${{ matrix.os }}
    name: Test Node.js ${{ matrix.node_version }} on ${{ matrix.os }} (${{ matrix.browser }})
    # The slowest of these jobs is windows/chromium at about seven minutes, four
    # of which are Playwright installing the Media Foundation feature. Twenty is
    # therefore roughly three times the worst honest run, and short enough that a
    # browser that has stopped answering costs twenty minutes rather than the six
    # hours GitHub would otherwise allow it.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node_version: ['26']
        os: [ubuntu-latest, windows-latest, macos-latest]
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        name: Setup Node.js ${{ matrix.node_version }}
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test module script
        # A cap of its own, so a wedged browser is reported as the test step
        # timing out rather than as the job running out somewhere unnamed. The
        # suite's slowest honest run is under three minutes.
        timeout-minutes: 10
        run: npm run test
        env:
          VITEST_BROWSER: ${{ matrix.browser }}
