name: run-test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - src/**
      - test/**
      - package.json
      - package-lock.json
      - tsconfig.json
      - tsconfig.prod.json
      - terser.config.json
      - vitest.config.ts
      - scripts/**
      - .github/workflows/run-test.yml
  workflow_dispatch:

# A superseded pull request run has nothing left to say, and a run that has
# wedged holds a runner until it is noticed. Pushes to `main` are exempt: each
# one is a commit whose own result is worth having.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint and typecheck
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        name: Setup Node.js
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npx prettier . --check
      - name: Typecheck
        run: npm run typecheck

  bundle:
    runs-on: ubuntu-latest
    name: Bundle size
    # The build is about half of this and the eleven scenarios the rest. A cap
    # well above that, because a job that hangs here holds a runner for nothing.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        name: Setup Node.js
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      # `prepare` has already built once on `npm ci`, but the check measures
      # `dist/` and should say so itself rather than inherit it.
      - name: Build
        run: npm run build
      - name: Check the bundle budgets
        run: npm run size

  compat:
    runs-on: ubuntu-latest
    name: Browser support
    # The build is most of this; the check itself reads one stylesheet and
    # type-checks `src/` once, in a few seconds.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        name: Setup Node.js
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      # The same reason as the bundle job: the check reads `dist/styles.css`,
      # and should build it itself rather than inherit `prepare`'s.
      - name: Build
        run: npm run build
      - name: Check the minimum browser versions
        run: npm run compat

  run-test:
    runs-on: ${{ matrix.os }}
    name: Test Node.js ${{ matrix.node_version }} on ${{ matrix.os }} (${{ matrix.browser }})
    # The slowest of these jobs is windows/firefox at about twelve minutes, ten of
    # which are the suite: that browser takes about four seconds to start each
    # test file, where every other pairing takes one or two. Windows/chromium is
    # next at about eight, four of which are Playwright installing the Media
    # Foundation feature. Thirty is therefore well clear of the worst honest run,
    # and short enough that a browser that has stopped answering costs half an
    # hour rather than the six hours GitHub would otherwise allow it.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node_version: ['26']
        os: [ubuntu-latest, windows-latest, macos-latest]
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        name: Setup Node.js ${{ matrix.node_version }}
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test module script
        # A cap of its own, so a wedged browser is reported as the test step
        # timing out rather than as the job running out somewhere unnamed.
        #
        # `npm test` is `scripts/run-tests.mjs`, which runs the suite in shards
        # of at most fifty files so that no browser session is asked to hold the
        # whole thing — chromium does not survive that, and had not finished a
        # run on any runner for weeks. It is one browser start-up per shard
        # rather than one in all. The slowest honest run is windows/firefox at
        # about ten and a half minutes, which a cap of ten cut off one file short
        # of the end; twenty leaves it room without hiding a wedged browser.
        timeout-minutes: 20
        run: npm run test
        env:
          VITEST_BROWSER: ${{ matrix.browser }}
