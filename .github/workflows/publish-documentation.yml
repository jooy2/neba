name: publish-documentation

on:
  # run every time a push occurs in the docs folder
  push:
    branches: [main]
    paths:
      - docs/**
      - packages/react/src/**
      - packages/react/CHANGELOG.md
      - packages/react/package.json
      - packages/flutter/lib/**
      - packages/flutter/example/**
      - packages/flutter/CHANGELOG.md
      - .github/workflows/publish-documentation.yml
  workflow_dispatch:

jobs:
  publish-documentation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # fetch all commits to get last updated time or other git log info
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            packages/react/package-lock.json

      # cache node_modules
      # The site renders `packages/react/src`, whose own imports resolve from
      # the package's `node_modules`.
      - name: Install the React package
        working-directory: ./packages/react
        run: npm ci --ignore-scripts

      - name: Install dependencies
        working-directory: ./docs
        run: npm ci

      # Copies both changelogs and the A2UI catalog in, then builds.
      - name: Build VitePress site
        working-directory: ./docs
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          # deploy to gh-pages branch
          target_branch: gh-pages
          # deploy the default output dir of VitePress
          build_dir: docs-dist
          jekyll: false
          fqdn: 'neba.cdget.com'
        env:
          # @see https://docs.github.com/en/actions/reference/authentication-in-a-workflow#about-the-github_token-secret
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
